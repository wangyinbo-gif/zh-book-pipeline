name: smoke

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 脚本语法检查
        run: |
          python - <<'PY'
          import pathlib
          files = sorted(pathlib.Path("tools").glob("*.py"))
          bad = []
          for p in files:
              try:
                  compile(p.read_text(encoding="utf-8"), str(p), "exec")
              except SyntaxError as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad) if bad else f"ok: {len(files)} files")
          raise SystemExit(1 if bad else 0)
          PY
      - name: 工具回归测试
        run: |
          python -m pip install --quiet pillow numpy pypdfium2 pymupdf
          python -m unittest discover -s tools -p "test_*.py"
      - name: 样书结构校验
        run: |
          python - <<'PY'
          import json, pathlib
          book = json.loads(pathlib.Path("samples/demo-book/book.json").read_text(encoding="utf-8"))
          assert book["blocks"], "empty blocks"
          assert book["stats"]["pages"] == book["pages"]
          print("demo ok:", book["title"], len(book["blocks"]), "blocks")
          PY