<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>筑学 · 刷题</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="practice.css" />
</head>
<body class="practice-page">
  <header class="practice-head">
    <a class="btn" href="index.html">← 书架</a>
    <span class="qb-title" id="qbTitle">加载中…</span>
    <span class="spacer"></span>
    <select id="chapterSel" aria-label="选择章节"></select>
    <select id="typeSel" aria-label="选择题型"></select>
    <select id="modeSel" aria-label="刷题范围">
      <option value="all">全部题目</option>
      <option value="todo">只刷没做过的</option>
      <option value="wrong">只刷做错的</option>
    </select>
    <button class="btn" id="wrongBtn">错题本 <b id="wrongCount">0</b></button>
    <button class="btn" id="resetBtn">重来</button>
  </header>

  <div class="practice-body">
    <main class="practice-stage" id="stage">
      <div class="q-src-summary hidden" id="srcSummary"></div>
      <div class="q-progress"><div class="q-bar"><i id="qBarFill"></i></div><span id="qMeta"></span></div>
      <article class="q-card" id="qCard">
        <div class="q-head"><span class="q-type" id="qType"></span><span class="q-chapter" id="qChapter"></span><span class="q-diff" id="qDiff"></span></div>
        <div class="q-stem" id="qStem"></div>
        <div class="q-body" id="qBody"></div>
        <div class="q-feedback hidden" id="qFeedback"></div>
        <div class="q-actions" id="qActions"></div>
      </article>
      <div class="q-nav">
        <button class="btn" id="prevBtn">← 上一题</button>
        <span id="qCounter"></span>
        <button class="btn" id="nextBtn">下一题 →</button>
      </div>
    </main>

    <aside class="wrong-panel hidden" id="wrongPanel">
      <div class="wp-head"><h3>错题本</h3><button class="btn" id="wpClose">关闭</button></div>
      <p class="wp-tip">做错的题会记在这里，点一条跳回那题；答对后自动移出。</p>
      <div id="wrongList"></div>
    </aside>
  </div>

  <script src="practice.js"></script>
</body>
</html>
